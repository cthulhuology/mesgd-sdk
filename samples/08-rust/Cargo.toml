[package]
name    = "mesgd-sample"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio             = { version = "1",    features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }
futures-util      = "0.3"
serde_json        = "1"
openssl           = { version = "0.10", features = ["v102", "v110"] }
base64            = "0.22"
anyhow            = "1"
